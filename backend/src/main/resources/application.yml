spring:
  application:
    name: tonus
  # "Moments" é uma feature do Spring Modulith (eventos de troca de dia/semana)
  # que o projeto não usa. Vem transitiva de spring-modulith-starter-core e,
  # em teste, quebra a resolução de Clock: dentro de @ApplicationModuleTest,
  # ObjectProvider<Clock> encontra dois beans (clock de produção + Clock fixo
  # do teste) e não decide por @Primary do jeito que o restante da aplicação
  # decide — sintoma só visível depois de shared virar sharedModule (ver
  # TonusApplication). Excluída por não ser usada, não por contornar bug.
  autoconfigure:
    exclude:
      - org.springframework.modulith.moments.autoconfigure.MomentsAutoConfiguration
  modulith:
    events:
      # Desligado, e o EventRepublicationJob é o único caminho de reentrega.
      #
      # Na subida o Modulith faz resubmitIncompletePublications(__ -> true):
      # TUDO que está incompleto, sem olhar idade. Isso fura o teto de
      # shared.events.max-age — uma pendência de seis meses, já desistida,
      # voltaria a ser entregue a cada restart — e, pior, impediria podar
      # notification_log: no fan-out de feriado as linhas de log convivem com
      # uma publicação incompleta, e apagá-las com a publicação ainda
      # republicável faria o aluno receber a mensagem de novo.
      #
      # O job cobre o mesmo caso: depois de um restart, o primeiro tique do
      # cron (até 5 min) reentrega o que está na janela. Troca-se recuperação
      # imediata por uma garantia que vale sempre.
      republish-outstanding-events-on-restart: false
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tonus}
    username: ${DB_USER:tonus}
    password: ${DB_PASSWORD:tonus}
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

shared:
  events:
    # De quanto em quanto tempo varrer o registry atrás de entrega pendente.
    republish-cron: "0 */5 * * * *"
    # Idade mínima para uma pendência contar como falha, e não como listener
    # ainda trabalhando. Uma entrega que falha espera entre 5 e 10 minutos para
    # ser tentada de novo — folgado para aviso de WhatsApp, e conservador o
    # bastante para não competir com o listener em curso.
    min-age: 5m
    # Teto: passado isso, desiste de reentregar. A tabela não tem contador de
    # tentativas, então sem teto uma entrega perdida em definitivo é retentada
    # a cada 5 minutos para sempre. Um dia porque aviso de aula cancelada não
    # vale mais nada depois disso. A linha continua no banco com
    # completion_date nulo — é a evidência de que aquele aviso nunca saiu.
    max-age: 24h
    # Poda das entregas já concluídas: o registry não apaga nada sozinho, e a
    # tabela está no caminho de toda publicação. Meia hora depois do job de
    # cobrança, para as duas varreduras noturnas não disputarem a mesma tabela.
    cleanup-cron: "0 30 3 * * *"
    # Uma semana é o que se costuma querer para responder "esse aviso saiu?"
    # depois de um aluno reclamar.
    retention: 7d

auth:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-before-any-real-deploy-0123456789}
    access-token-ttl: 10m
  refresh-token:
    ttl: 7d

billing:
  # Dias de tolerância após o vencimento antes de uma fatura ABERTA virar
  # ATRASADA (ver SPEC-004).
  days-overdue: 1
  # Cron do job diário de cobrança (@Scheduled + ShedLock): 3h da manhã,
  # fuso do estúdio.
  job-cron: "0 0 3 * * *"

notification:
  # Falhas seguidas num fan-out de feriado abortam o laço. Não é azar com N
  # alunos, é o gateway fora do ar — e insistir custa um read timeout por
  # aluno. O que sobrou volta pelo job de republicação.
  consecutive-failure-limit: 5
  # Poda do histórico de avisos. Só é segura porque a reentrega tem teto
  # (shared.events.max-age): a tabela é a chave de idempotência, e apagar linha
  # de aviso ainda republicável reenviaria a mensagem. Seis meses deixa a
  # distância entre as duas grande demais para alguém encostar por engano.
  cleanup-cron: "0 45 3 * * *"
  log-retention: 180d
  evolution:
    # Nasce desligado. Ligado sem querer, o primeiro job de cobrança manda
    # WhatsApp de verdade para aluno de verdade — errar para o lado do
    # silêncio é o único erro reversível aqui.
    enabled: ${NOTIFICATION_ENABLED:false}
    # Sem valor de desenvolvimento: com enabled=true, a aplicação recusa subir
    # se faltar qualquer um dos dois. Chave de API em application.yml seria
    # segredo versionado.
    base-url: ${EVOLUTION_BASE_URL:}
    api-key: ${EVOLUTION_API_KEY:}
    instance: ${EVOLUTION_INSTANCE:tonus}
    # Timeout nos dois lados: sem eles, uma Evolution que aceita a conexão e
    # nunca responde trava um listener assíncrono para sempre.
    connect-timeout: 3s
    read-timeout: 10s
