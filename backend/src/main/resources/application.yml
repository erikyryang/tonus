spring:
  application:
    name: tonus
  config:
    # The same .env that Compose already reads, so the file is one source of
    # truth instead of two. Without this, `docker compose --profile whatsapp
    # up -d` picks up EVOLUTION_* and `./mvnw spring-boot:run` does not:
    # flipping NOTIFICATION_ENABLED=true in .env would configure the gateway
    # and leave the application on LoggingWhatsAppSender, silently, with
    # nothing in the log explaining why no message went out.
    #
    # [.properties] because the filename carries no extension and Boot has no
    # other way to know the format. `optional:` because a fresh clone has no
    # .env until someone copies .env.example, and the defaults below already
    # cover development.
    #
    # Does NOT weaken the rule that secrets come from the environment: real
    # environment variables outrank config files in Boot's precedence order,
    # so production keeps overriding this — and .env is gitignored anyway.
    import: "optional:file:.env[.properties]"
  # "Moments" is a Spring Modulith feature (day/week change events) that this
  # project doesn't use. It comes in transitively via
  # spring-modulith-starter-core and, in tests, breaks Clock resolution:
  # inside @ApplicationModuleTest, ObjectProvider<Clock> finds two beans
  # (the production clock + the test's fixed Clock) and doesn't pick one via
  # @Primary the way the rest of the application does — a symptom only
  # visible after shared became sharedModule (see TonusApplication). Excluded
  # because it's unused, not to work around a bug.
  autoconfigure:
    exclude:
      - org.springframework.modulith.moments.autoconfigure.MomentsAutoConfiguration
  modulith:
    events:
      # Disabled, with EventRepublicationJob as the only redelivery path.
      #
      # On startup, Modulith runs resubmitIncompletePublications(__ -> true):
      # EVERYTHING that's incomplete, regardless of age. That blows past
      # shared.events.max-age — a six-month-old, already-abandoned pending
      # event would be redelivered on every restart — and, worse, it would
      # block pruning notification_log: in an announcement fan-out, log rows
      # coexist with an incomplete publication, and deleting them while the
      # publication is still re-publishable would make the student receive
      # the message again.
      #
      # The job covers the same case: after a restart, the cron's first tick
      # (up to 5 min) redelivers whatever's in the window. Trading immediate
      # recovery for a guarantee that always holds.
      republish-outstanding-events-on-restart: false
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tonus}
    username: ${DB_USER:tonus}
    password: ${DB_PASSWORD:tonus}
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  # Caddy terminates TLS and talks HTTP to the application. Without this,
  # every request looks like HTTP in here and the session cookie would go out
  # without Secure in production — see AuthController.buildCookie, which
  # decides the attribute based on the request's transport. AuthCookieSecureIT
  # covers it.
  forward-headers-strategy: framework

shared:
  events:
    # How often to sweep the registry for pending deliveries.
    republish-cron: "0 */5 * * * *"
    # Minimum age for a pending item to count as a failure, rather than a
    # listener still working. A failed delivery waits between 5 and 10
    # minutes before being retried — generous enough for a WhatsApp notice,
    # and conservative enough not to compete with a listener already in
    # progress.
    min-age: 5m
    # Ceiling: past this, stop trying to redeliver. The table has no attempt
    # counter, so without a ceiling a permanently lost delivery would be
    # retried every 5 minutes forever. One day, because a canceled-class
    # notice isn't worth anything anymore after that. The row stays in the
    # database with a null completion_date — that's the evidence that notice
    # never went out.
    max-age: 24h
    # Pruning of already-completed deliveries: the registry doesn't delete
    # anything on its own, and the table sits on the path of every
    # publication. Half an hour after the billing job, so the two nightly
    # sweeps don't contend for the same table.
    cleanup-cron: "0 30 3 * * *"
    # A week is what people usually want in order to answer "did that notice
    # go out?" after a student complains.
    retention: 7d

auth:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-before-any-real-deploy-0123456789}
    access-token-ttl: 10m
  refresh-token:
    ttl: 7d

billing:
  # Grace period in days after the due date before an OPEN invoice becomes
  # OVERDUE (see SPEC-004).
  days-overdue: 1
  # Cron for the daily billing job (@Scheduled + ShedLock): 3am, studio's
  # timezone.
  job-cron: "0 0 3 * * *"

notification:
  # Consecutive failures in an announcement fan-out abort the loop. It's not
  # bad luck with N students, it's the gateway being down — and retrying
  # costs one read timeout per student. Whatever's left comes back through
  # the republication job.
  consecutive-failure-limit: 5
  # Pruning of notice history. Only safe because redelivery has a ceiling
  # (shared.events.max-age): the table is the idempotency key, and deleting a
  # notice row that's still re-publishable would resend the message. Six
  # months keeps the distance between the two large enough that nobody
  # bumps into it by accident.
  cleanup-cron: "0 45 3 * * *"
  log-retention: 180d
  evolution:
    # Starts disabled. Turned on by accident, the first billing job sends a
    # real WhatsApp message to a real student — erring on the side of
    # silence is the only reversible mistake here.
    enabled: ${NOTIFICATION_ENABLED:false}
    # No development default: with enabled=true, the application refuses to
    # start if either is missing. An API key in application.yml would be a
    # versioned secret.
    base-url: ${EVOLUTION_BASE_URL:}
    api-key: ${EVOLUTION_API_KEY:}
    instance: ${EVOLUTION_INSTANCE:tonus}
    # Only what the screen shows as "in effect" (SPEC-013). The value that
    # actually governs pairing lives in the gateway's container, and no
    # Evolution endpoint reports it — this is the same .env value the
    # container was given, which is the closest the application can get.
    phone-version: ${WHATSAPP_VERSION:}
    # Timeouts on both sides: without them, an Evolution instance that
    # accepts the connection and never responds hangs an async listener
    # forever.
    connect-timeout: 3s
    read-timeout: 10s
