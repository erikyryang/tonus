spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

shared:
  events:
    # Crons that don't run during the suite (3am on January 1st). Tests that
    # exercise reprocessing call the Modulith API by hand; leaving the jobs
    # unchecked would add unpredictable redelivery — or deletion — in the
    # middle of another test.
    republish-cron: "0 0 3 1 1 *"
    cleanup-cron: "0 0 3 1 1 *"

notification:
  # Same reason: the history pruning is called by hand by the test that
  # exercises it, and an unchecked job would delete a row in the middle of
  # another test.
  cleanup-cron: "0 0 3 1 1 *"

billing:
  # The daily job runs at 3am in production — and would run in the middle of
  # the suite for whoever runs it overnight, generating an invoice and
  # publishing an event underneath the tests. BillingJobIT calls
  # BillingService directly (see its javadoc about the lock), so nothing
  # here depends on the schedule.
  job-cron: "0 0 3 1 1 *"

auth:
  jwt:
    secret: test-secret-key-not-for-production-use-0123456789
    access-token-ttl: 10m
  refresh-token:
    ttl: 7d
