services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-tonus}
      POSTGRES_USER: ${DB_USER:-tonus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tonus}
    # Loopback only: the dev flow documented in CLAUDE.md runs the app on
    # the host (./mvnw spring-boot:run) talking to DB_HOST=localhost, so the
    # port needs to be reachable from there — but publishing it on all
    # interfaces (0.0.0.0, Compose's default) would expose Postgres with the
    # default password from .env.example to any host on the same network, or
    # to the whole internet if this compose file is reused on a machine with
    # a public IP. The evolution service below publishes its port the same
    # way, and for a stronger reason — see the comment there.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tonus-db-data:/var/lib/postgresql/data
      # Creates the Evolution database on the volume's first startup. See
      # the file header for what to do if the volume already exists.
      - ./docker/init-evolution-db.sql:/docker-entrypoint-initdb.d/10-evolution.sql:ro
    networks:
      - tonus

  # WhatsApp gateway (SPEC-005).
  #
  # Gated behind a profile so `docker compose up -d db` still brings up just
  # the database, which is the development flow documented in CLAUDE.md. In
  # development NOTIFICATION_ENABLED=false and the app doesn't even look for
  # it; starting this service only makes sense when you're about to pair a
  # session or exercise the sending path.
  #
  #   docker compose --profile whatsapp up -d
  evolution:
    # evoapicloud, not atendai: the product moved repositories and
    # `docker pull atendai/evolution-api` now returns "access denied". The
    # image and variables here match EvolutionApiContractIT — if a tag
    # disappears, it breaks in the test, not in deploy.
    image: evoapicloud/evolution-api:v2.3.7
    profiles:
      - whatsapp
    restart: unless-stopped
    # 127.0.0.1 and never 0.0.0.0: this API sends messages on the studio's
    # behalf and holds the WhatsApp session, which is a credential — the
    # volume below is what keeps it across restarts. Published at all
    # because two things need it from the host and neither can reach the
    # compose network:
    #   - the Evolution Manager (http://localhost:8081/manager) is a web page,
    #     and creating the instance + reading the QR code happens there;
    #   - the app itself, which the dev flow runs on the host, so
    #     EVOLUTION_BASE_URL has to be http://localhost:8081 — the `evolution`
    #     hostname only resolves inside the network.
    # 8081 and not 8080 because the app already owns 8080 on the host
    # (server.port in application.yml).
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      # No `:?` on purpose: Compose interpolates the whole file before
      # looking at profiles, so the variant that requires the variable would
      # break `docker compose up -d db` in the development flow. The missing
      # key is blocked where it matters — Evolution refuses to start without
      # it, and the app refuses to start with enabled=true and an empty
      # api-key.
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-}
      # Names checked against the product's own .env.example. The full set
      # is much bigger; this is just the minimum to run with Postgres and no
      # Redis — adding Redis would be new infra to discuss first.
      #
      # The Manager's frontend runs in the host's browser and calls back into
      # SERVER_URL, so it has to be the address the host can reach. With the
      # in-network name the page loads and every request from it fails.
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://localhost:8081}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${DB_USER:-tonus}:${DB_PASSWORD:-tonus}@db:5432/evolution?schema=public
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"

      # WhatsApp Web version used by Baileys, the engine underneath. Baileys
      # pins a version in its own source; when that pin goes stale WhatsApp
      # refuses the handshake and pairing dies with a 405 / "connection
      # failure" — the QR simply never connects, with nothing in the log
      # pointing at the cause. Overriding it here is the fix that doesn't
      # require a new image. Current value from
      # WhiskeySockets/Baileys → src/Defaults/baileys-version.json.
      CONFIG_SESSION_PHONE_VERSION: ${WHATSAPP_VERSION:-2.3000.1043857760}
      # What shows up under WhatsApp → Linked devices on the studio's phone.
      # Worth naming: whoever looks at that list should recognize what they
      # authorized.
      CONFIG_SESSION_PHONE_CLIENT: Tonus
      CONFIG_SESSION_PHONE_NAME: Chrome
      # How many times the QR is regenerated before giving up during pairing.
      QRCODE_LIMIT: "30"
      LANGUAGE: pt-BR

      # Losing the instance means losing the paired session — no automatic
      # cleanup of an idle one.
      DEL_INSTANCE: "false"
      # Nothing consumes Evolution's webhooks here: the app talks to it, not
      # the other way around.
      WEBHOOK_GLOBAL_ENABLED: "false"
      # No usage data about the studio going to a third party.
      TELEMETRY_ENABLED: "false"

      # By default Evolution persists message bodies, contacts, chats and
      # history into the `evolution` database. CLAUDE.md forbids logging a
      # full phone number or the content of a WhatsApp message, and a table
      # is the same exposure with a longer shelf life — the studio's own
      # notices are already in notification_log, and the students' replies
      # are nobody's business here.
      #
      # INSTANCE stays on: that row IS the persisted session. Turning it off
      # means scanning the QR code again after every restart.
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
    volumes:
      - tonus-evolution-instances:/evolution/instances
    depends_on:
      - db
    networks:
      - tonus

volumes:
  tonus-db-data:
  tonus-evolution-instances:

networks:
  tonus:
