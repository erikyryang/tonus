services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-tonus}
      POSTGRES_USER: ${DB_USER:-tonus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tonus}
    # Só no loopback: o fluxo de dev documentado no CLAUDE.md roda a
    # aplicação no host (./mvnw spring-boot:run) falando com DB_HOST=localhost,
    # então a porta precisa ser alcançável daqui — mas publicá-la em todas as
    # interfaces (0.0.0.0, o padrão do Compose) expõe o Postgres com a senha
    # padrão do .env.example a qualquer host na mesma rede, ou à internet
    # inteira se este compose for reaproveitado numa máquina com IP público.
    # Mesmo raciocínio do serviço evolution abaixo, que não publica porta
    # nenhuma por não precisar ser alcançado do host.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tonus-db-data:/var/lib/postgresql/data
      # Cria o banco da Evolution na primeira subida do volume. Ver o
      # cabeçalho do arquivo para o caso de volume já existente.
      - ./docker/init-evolution-db.sql:/docker-entrypoint-initdb.d/10-evolution.sql:ro
    networks:
      - tonus

  # Gateway de WhatsApp (SPEC-005).
  #
  # Sem `ports`: a Evolution NÃO é alcançável do host, só de dentro da rede
  # `tonus`. Quem abre essa porta expõe à internet uma API que manda mensagem
  # em nome do estúdio e carrega a sessão de WhatsApp — a sessão é credencial,
  # e o volume abaixo é o que a guarda entre reinícios.
  #
  # Atrás de um profile para `docker compose up -d db` continuar subindo só o
  # banco, que é o fluxo de desenvolvimento documentado no CLAUDE.md. Em
  # desenvolvimento NOTIFICATION_ENABLED=false e a aplicação nem procura por
  # ela; subir este serviço só faz sentido junto com a aplicação na mesma rede.
  #
  #   docker compose --profile whatsapp up -d
  evolution:
    # evoapicloud, não atendai: o produto migrou de repositório e
    # `docker pull atendai/evolution-api` responde "access denied". Imagem e
    # variáveis daqui são as mesmas de EvolutionApiContractIT — se uma tag
    # sumir, quebra no teste e não no deploy.
    image: evoapicloud/evolution-api:v2.3.7
    profiles:
      - whatsapp
    restart: unless-stopped
    environment:
      # Sem `:?` de propósito: o compose interpola o arquivo inteiro antes de
      # olhar profiles, então a variante que exige a variável quebraria o
      # `docker compose up -d db` do fluxo de desenvolvimento. A chave ausente
      # é barrada onde importa — a Evolution recusa subir sem ela, e a
      # aplicação recusa subir com enabled=true e api-key vazia.
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-}
      # Nomes conferidos contra o .env.example do próprio produto. O conjunto
      # completo é bem maior; aqui está só o mínimo para subir com Postgres e
      # sem Redis — acrescentar Redis seria infra nova para discutir antes.
      SERVER_URL: http://evolution:8080
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${DB_USER:-tonus}:${DB_PASSWORD:-tonus}@db:5432/evolution?schema=public
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
    volumes:
      - tonus-evolution-instances:/evolution/instances
    depends_on:
      - db
    networks:
      - tonus

volumes:
  tonus-db-data:
  tonus-evolution-instances:

networks:
  tonus:
